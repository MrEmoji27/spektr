name: build linux binary

# Builds a native Linux executable on a clean Ubuntu runner and attaches it to
# the same release as the Windows exe, so Linux users get a double-clickable
# file instead of being told to install Python. The spec is already
# cross-platform: on Linux it skips the missing `_sounddevice_data` wheel
# (a note, not a failure) and picks up `soundcard.pulseaudio`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # the "Run workflow" button, for a test build

permissions:
  contents: write             # needed to attach files to a release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system audio libraries
        # The frozen binary loads these at runtime via cffi/ctypes rather than
        # bundling them, so they must exist on the build host for analysis to
        # see them — and on the user's machine to run. soundcard.pulseaudio
        # dlopens libpulse; sounddevice/PortAudio is the fallback capture path.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.3"
          pip install -e ".[dev]"

      - name: Run the test suites
        # Same tests as the Windows build — none of them need an audio device.
        # See that workflow for why the two script-style files are named on
        # top of the pytest run.
        run: |
          python -m pytest tests/ -q
          python tests/test_app.py
          python tests/test_plugins.py

      - name: Check onset accuracy and render cost
        # Both can fail. See the Windows workflow for what they gate.
        run: |
          python tests/onset_score.py
          # --report-ratchet: the drift table is printed but does not fail
          # the build. Its baseline is a set of ratios recorded on the dev
          # box, and a ratio does not survive a change of machine — one
          # commit measured 0 drifted there, 3 on a GitHub Windows runner
          # and 9 on a Linux one, with disjoint offenders. The absolute
          # frame-budget check still gates here, and it is the one that
          # means something on someone else's hardware.
          python tests/bench.py --report-ratchet

      - name: Build portable binary
        # No SPEKTR_ONEDIR here: a onefile ELF is the single "download and run"
        # artifact. The onedir/installer shape is Windows-specific.
        run: pyinstaller --noconfirm --clean packaging/spektr.spec

      - name: Smoke test the binary
        run: |
          ./dist/spektr --version
          ./dist/spektr --list-modes

      - uses: actions/upload-artifact@v4
        with:
          name: spektr-linux
          path: dist/spektr
          if-no-files-found: error

      - name: Attach to the release
        # Uploads this job's files and nothing else. The release and all of its
        # text, the download guide included, come from
        # docs/release-notes-<version>.md, created before the tag is pushed.
        # The three build jobs used to append a section each to the release
        # body, and jobs that edit one body at the same moment race: 0.5.0 lost
        # its Linux section that way. They also published the release as they
        # went. Publishing is now done by hand once every file is attached.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || {
            echo "::error::no release for $TAG. Create it first: gh release create $TAG --draft --title \"spektr ${TAG#v}\" --notes-file docs/release-notes-${TAG#v}.md"
            exit 1
          }
          gh release upload "$TAG" dist/spektr --repo "$GITHUB_REPOSITORY" --clobber

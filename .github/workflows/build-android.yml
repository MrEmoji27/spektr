name: build android apk

# Builds and signs the APK on a clean runner, so the phone build ships from the
# same tag as the exe and the Linux binary rather than from whoever last had a
# tablet plugged in. Tagging v0.4.0 (or whatever) attaches it to the matching
# GitHub release alongside them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # the "Run workflow" button, for a test build

permissions:
  contents: write             # needed to attach files to a release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Chaquopy runs pip on the build machine to resolve numpy for the target,
      # so the runner needs a working Python even though none of it ends up
      # running here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Python side
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the bridge against the engine it wraps
        # The port's own failure mode: the Python bridge rotted 101 commits
        # behind the engine and every mode raised on the first render, because
        # nothing imported the file. These also hold the vendored copy of
        # spektr/ to the real one and check every offered mode's glyphs against
        # the font the APK actually ships.
        run: python -m pytest tests/test_android_bridge.py tests/test_android_font.py -q

      - name: Work out the version from the tag
        # versionCode has to increase monotonically forever, so it is derived
        # rather than hand-bumped: 0.4.0 -> 400, 1.2.3 -> 10203.
        id: version
        run: |
          REF="${GITHUB_REF#refs/tags/v}"
          if [ "$REF" = "$GITHUB_REF" ]; then REF="0.0.0"; fi   # not a tag build
          IFS=. read -r MAJOR MINOR PATCH <<< "$REF"
          echo "name=$REF" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          echo "building $REF as versionCode $((MAJOR * 10000 + MINOR * 100 + PATCH))"

      - name: Unpack the signing key
        # Absent on a fork or a dispatch without secrets: the build still runs
        # and produces an unsigned APK, which is fine for checking the build
        # and useless for installing. The release step refuses to attach one.
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret — building unsigned"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spektr.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        working-directory: android
        env:
          SPEKTR_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/spektr.jks', runner.temp) || '' }}
          SPEKTR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPEKTR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPEKTR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # arm64-v8a only. CPython and numpy ship per ABI, so a second
          # architecture roughly doubles a 55 MB APK to serve emulators.
          ./gradlew :app:assembleRelease --no-daemon \
            -Pabi=arm64-v8a \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          mv app/build/outputs/apk/release/app-release*.apk \
             "$GITHUB_WORKSPACE/spektr-${{ steps.version.outputs.name }}-arm64-v8a.apk"

      - name: Check what actually came out
        # Reading the built APK rather than the files that went into it. Both
        # of the port's worst bugs were invisible from the source: RECORD_AUDIO
        # was missing from the manifest, and the engine failed on the first
        # frame with the Python assets sitting right there in the package.
        run: |
          APK="spektr-${{ steps.version.outputs.name }}-arm64-v8a.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^package|uses-permission" || true
          "$AAPT" dump badging "$APK" | grep -q "name='android.permission.RECORD_AUDIO'" \
            || { echo "::error::RECORD_AUDIO is missing — capture cannot start"; exit 1; }
          unzip -l "$APK" | grep -q "assets/chaquopy" \
            || { echo "::error::no Python in the APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/CHANGELOG.md" \
            || { echo "::error::the changelog did not ship"; exit 1; }

      - name: Check it is signed
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose "spektr-${{ steps.version.outputs.name }}-arm64-v8a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: spektr-android
          path: spektr-*.apk
          if-no-files-found: error

      - name: Attach to the release
        # Only a signed one. An unsigned APK cannot be installed, and putting
        # it on a release is worse than putting nothing there — it looks like
        # a download that works.
        if: startsWith(github.ref, 'refs/tags/') && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: spektr-*.apk
          # Appends, like the other two build jobs: the release owns its notes
          # and a build job only adds a section about the file it uploaded.
          append_body: true
          body: |
            **Android — Android 10 or newer, 64-bit ARM.**

            * `spektr-*-arm64-v8a.apk` — sideload it. You will need to allow
              installs from your browser or file manager the first time.

            It captures what your device is playing, which needs the screen
            recording permission as well as the microphone one: Android has no
            separate "record the audio only" consent. Nothing leaves the device.

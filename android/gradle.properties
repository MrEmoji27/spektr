org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The port's own version, which is not the desktop app's.
#
# spektr 0.4.0 is the release; this is the second version of the Android
# build that ships inside it, and saying 0.4.0 on the APK would claim four
# releases of a thing that has had two. Kept here rather than in
# build.gradle.kts so there is one line to change, and checked against the
# top heading of CHANGELOG.md by tests/test_android_version.py so the number
# on the APK and the number in the release notes cannot disagree.
spektrAndroidVersion=0.2.0

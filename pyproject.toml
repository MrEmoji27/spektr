[project]
name = "spektr"
version = "0.2.0"
description = "A terminal spectrum analyser for system audio — twenty-seven render modes and forty themes, drawn with braille."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zemo", email = "zemo@tuta.com" }]
keywords = ["terminal", "tui", "audio", "visualizer", "spectrum", "fft", "textual", "loopback"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "textual>=0.60.0",
  "sounddevice>=0.5.0",
  "numpy>=1.24.0",
  "rich>=13.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
  # PortAudio (and therefore sounddevice) cannot do WASAPI loopback at any
  # version — soundcard talks to WASAPI directly and can. It is the primary
  # capture path on Windows and also handles PulseAudio monitors on Linux.
  "soundcard>=0.4.2",
]

[project.scripts]
spektr = "spektr.app:main"

[project.urls]
Homepage = "https://github.com/MrEmoji27/spektr"

[build-system]
requires = ["setuptools>=77"]   # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spektr*"]

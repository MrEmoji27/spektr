[project]
name = "spektr"
version = "0.2.1"
description = "A terminal spectrum analyser for system audio — twenty-nine render modes and forty-seven themes, drawn with braille."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zemo", email = "zemo@tuta.com" }]
keywords = ["terminal", "tui", "audio", "visualizer", "spectrum", "fft", "textual", "loopback"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "textual>=0.60.0",
  "sounddevice>=0.5.0",
  "numpy>=1.24.0",
  "rich>=13.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
  # PortAudio (and therefore sounddevice) cannot do WASAPI loopback at any
  # version — soundcard talks to WASAPI directly and can. It is the primary
  # capture path on Windows and also handles PulseAudio monitors on Linux.
  "soundcard>=0.4.2",
  # Now-playing header text: none of these is required for spektr to run —
  # nowplaying.py treats an ImportError exactly like "nothing playing" — but
  # installing them by default is what makes the feature work without an
  # extra manual step on the two platforms it actually applies to.
  #
  # The monolithic `winsdk` package was tried first and dropped: its latest
  # release (1.0.0b10) ships wheels for cp38-cp312 only, so on 3.13 pip falls
  # back to a source build that needs a CMake + C++ toolchain most machines
  # don't have — meaning the dependency silently never installed, and the
  # feature silently never worked. `winrt-*` is the split-per-namespace
  # sibling project, published with 3.13 wheels already. It needs two
  # packages, not one: the Foundation namespace is a runtime dependency of
  # Media.Control that its own package metadata doesn't declare, so pip
  # won't pull it in on its own — confirmed by hitting exactly that
  # ModuleNotFoundError with only Media.Control installed.
  "winrt-Windows.Media.Control>=3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
]

[project.scripts]
spektr = "spektr.app:main"

[project.urls]
Homepage = "https://github.com/MrEmoji27/spektr"

[build-system]
requires = ["setuptools>=77"]   # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spektr*"]

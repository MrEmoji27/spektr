[project]
name = "spektr-audio"
version = "0.4.0"
description = "A terminal spectrum analyser for system audio — forty-four render modes and forty-nine themes, drawn with braille."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zemo", email = "zemo@tuta.com" }]
keywords = ["terminal", "tui", "audio", "visualizer", "spectrum", "fft", "textual", "loopback"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "textual>=0.60.0",
  "sounddevice>=0.5.0",
  "numpy>=1.24.0",
  "rich>=13.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
  # PortAudio (and therefore sounddevice) cannot do WASAPI loopback at any
  # version — soundcard talks to WASAPI directly and can. It is the primary
  # capture path on Windows and also handles PulseAudio monitors on Linux.
  "soundcard>=0.4.2",
  # Now-playing header text: none of these is required for spektr to run —
  # nowplaying.py treats an ImportError exactly like "nothing playing" — but
  # installing them by default is what makes the feature work without an
  # extra manual step on the two platforms it actually applies to.
  #
  # The monolithic `winsdk` package was tried first and dropped: its latest
  # release (1.0.0b10) ships wheels for cp38-cp312 only, so on 3.13 pip falls
  # back to a source build that needs a CMake + C++ toolchain most machines
  # don't have — meaning the dependency silently never installed, and the
  # feature silently never worked. `winrt-*` is the split-per-namespace
  # sibling project, published with 3.13 wheels already. It needs two
  # packages, not one: the Foundation namespace is a runtime dependency of
  # Media.Control that its own package metadata doesn't declare, so pip
  # won't pull it in on its own — confirmed by hitting exactly that
  # ModuleNotFoundError with only Media.Control installed.
  "winrt-Windows.Media.Control>=3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Everything CI needs beyond the runtime deps. `pip install -e .[dev]` gets a
# checkout to the same state the workflows run in, so a failure there is
# reproducible locally without guessing at versions.
dev = [
  "pytest>=8.0",
  # Reads the cmap of the font the APK ships, so a mode emitting a codepoint
  # that font lacks fails here rather than rendering as tofu on a tablet.
  "fonttools>=4.50",
]

[project.scripts]
spektr = "spektr.app:main"

[project.urls]
Homepage = "https://github.com/MrEmoji27/spektr"

[build-system]
requires = ["setuptools>=77"]   # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spektr*"]

# ── ruff ──────────────────────────────────────────────────────────────────────
# Make "empty ruff run" reproducible. Without a repo config, ruff picks up
# whatever ~/.config/ruff enables, so the same files lint differently per
# machine. CI does not gate on ruff today, but a stable baseline is what makes
# it *possible* to gate on later.
[tool.ruff]
target-version = "py310"        # requires-python >= 3.10
line-length = 100               # the codebase deliberately runs ~100-wide, not 88
extend-exclude = ["build", "dist", ".venv", ".venv-build", ".ruff_cache"]

[tool.ruff.lint]
# F is pyflakes (undefined names / unused imports — real bugs); I keeps imports
# sorted; RUF023 sorts `__slots__`. RUF046 (redundant `int()`), RUF022
# (`__all__` sort) and RUF100 (unused `noqa`) are deliberately left out:
#   - RUF046 is unsafe to auto-fix and a false positive here — round() on a
#     numpy scalar stays a numpy float, so `int(round(...))` in palette.py is
#     genuinely needed to keep a Python int.
#   - RUF022 would flatten api.py's `__all__`, which is intentionally grouped
#     by category behind comments.
#   - RUF100 strips `# noqa:` comments the moment the referenced rule isn't
#     active — but several of them (e.g. `# noqa: BLE001` on deliberate broad
#     catches) exist as *documentation of intent*, and deleting them on a rule
#     toggle destroys that. Ruff's auto-fix dropped 30+ of them; they were
#     restored by hand and the rule isn't worth re-enabling.
#
# Deliberately NOT enabled: BLE/S — this is a terminal audio app and catching a
# broad Exception on purpose (read-only home, missing backend package, a
# transient audio error) is a deliberate resilience choice, not a bug — plus
# PLR/RET/SIM/PERF (opinionated style), RUF012 (Textual `BINDINGS` are
# intentionally mutable class attributes), and UP (aggressive typing churn on
# a codebase that already targets 3.10+ with `from __future__ import
# annotations`). E is left unselected too: the code runs ~100-col, and the one
# E402 it would raise (`api.py` sets API_VERSION before the imports) is
# intentional.
select = [
    "F", "I",
    "RUF023",
]

# modes/__init__.py imports the mode modules in deliberate *menu order* (each
# registers itself as a side-effect) — I001 wants them collapsed and sorted
# alphabetically, which would fight the documented ordering. Everything else
# in the file still satisfies I001.
[tool.ruff.lint.per-file-ignores]
"spektr/modes/__init__.py" = ["I001"]
